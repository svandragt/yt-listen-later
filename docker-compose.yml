services:
  yt-listen-later:
    build: .
    image: yt-listen-later
    container_name: yt-listen-later
    restart: unless-stopped

    # Playlist, BASE_URL, MAX_TOTAL_MB and friends all come from .env.
    env_file: .env
    environment:
      # These override .env: inside the container the paths and bind address are
      # fixed, whatever the host config says.
      PUBLIC_DIR: /data/public
      HOST: 0.0.0.0
      PORT: 8000
      # YouTube requires a PO token for datacenter IPs before it'll return
      # audio formats; pot-provider generates them on the internal network.
      POT_PROVIDER_URL: http://pot-provider:4416
      # Cookies are effectively mandatory on a server — without them YouTube
      # answers "Sign in to confirm you're not a bot" for nearly everything.
      # Wired here rather than left to .env so dropping the file in ./data is
      # all it takes; a missing file warns and syncs on without cookies.
      COOKIE_FILE: /data/cookies.txt

    depends_on: [pot-provider]

    volumes:
      # Audio, feed.xml and the state file. chown it to uid 1000 first:
      #   mkdir -p data && sudo chown -R 1000:1000 data
      - ./data:/data

    # Loopback only — the reverse proxy below terminates TLS. Drop the
    # 127.0.0.1: prefix only if you are proxying from another host.
    ports:
      - "127.0.0.1:8000:8000"

    # Transcoding will happily eat a small VPS; keep it in its lane.
    cpus: 1.0
    mem_limit: 768m
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Generates PO tokens so yt-dlp can fetch audio formats from a datacenter
  # IP, which YouTube otherwise refuses even with valid cookies. Internal
  # only — no host port published. The tag must match the plugin pin in
  # yt_listen_later.py: the plugin refuses to talk to a server on another major
  # version, and a floating tag let 2.0.0 land on its own and stall every sync.
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.0
    container_name: yt-listen-later-pot-provider
    restart: unless-stopped

  # Automatic HTTPS, which Overcast needs. Start it with:
  #   docker compose --profile tls up -d
  caddy:
    image: caddy:2-alpine
    container_name: yt-listen-later-caddy
    profiles: [tls]
    restart: unless-stopped
    depends_on: [yt-listen-later]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
